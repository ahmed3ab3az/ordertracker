[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ordertracker"
version = "0.1.0"
description = "Order Tracking & Profit Management System — PyQt6 desktop app with Neon Postgres backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ahmed Abdelaziz", email = "ahmed3ab3az@gmail.com" }]
dependencies = [
    "PyQt6>=6.7.0",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "bcrypt>=4.1.3",
    "cryptography>=42.0.7",
    "keyring>=25.2.1",
    "python-barcode>=0.15.1",
    "Pillow>=10.3.0",
    "openpyxl>=3.1.2",
    "python-dateutil>=2.9.0",
    "requests>=2.32.3",
    "packaging>=24.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
]
build = [
    "pyinstaller>=6.7.0",
]

[project.scripts]
ordertracker = "ordertracker.app:main"
ordertracker-archive = "ordertracker.cli.archive:main"
ordertracker-seed = "ordertracker.cli.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ordertracker.i18n" = ["*.json"]
"ordertracker.ui" = ["styles/*.qss", "assets/*.png", "assets/*.svg"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (FastAPI/PyQt patterns)
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "F401"]
"tests/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "qt: tests that require a QApplication",
    "integration: tests that hit a real database",
]
